<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Opening your portal…</title>
    <script>
      // The nominee dashboard is now the Nominee Portal. Old links, bookmarks and emails land in the right place.
      var q = location.search;
      var back = new URLSearchParams(q).get("pay") === "return";
      location.replace((back ? "portal/entries" : "portal/") + q);
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=portal/" /></noscript>
  </head>
  <body
    style="
      font-family: system-ui, sans-serif;
      background: #0a0a0a;
      color: #f7f5ef;
      padding: 3rem;
      text-align: center;
    "
  >
    <p>Opening your Nominee Portal…</p>
  </body>
</html>
